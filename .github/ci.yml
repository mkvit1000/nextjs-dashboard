name: Next.js CI

# 1. When to run
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 2. What to do
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone your repository onto the runner VM
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # caches node_modules for faster subsequent runs

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run linter
      - name: Run linter
        run: npm run lint

      # Step 5: Test building the app
      - name: Build Next.js
        run: npm run build